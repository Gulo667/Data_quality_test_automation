[pytest]

# 1. Where tests live (faster, cleaner)
testpaths = tests

# 2. Keep output readable
addopts = -ra

# 3. Ignore noisy third-party deprecations (your case)
filterwarnings =
    ignore::DeprecationWarning

# 4. Allow simple test markers (optional, but common)
markers =
    csv: general CSV file tests
    csv_schema: CSV structure / columns
    csv_data: CSV content validation
    slow: large-file or heavy checks

